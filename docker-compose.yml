version: '3.8'

services:
  vedyura:
    build: .
    container_name: vedyura-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - app-data:/app/data
    networks:
      - vedyura-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: vedyura-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/static:ro
    depends_on:
      vedyura:
        condition: service_healthy
    networks:
      - vedyura-net

volumes:
  app-data:

networks:
  vedyura-net:
    driver: bridge
